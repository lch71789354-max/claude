<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>하루 다섯 단어</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Noto+Sans+KR:wght@400;500;700&family=Charis+SIL:wght@400&display=swap">
<style>
/* Layout: one reading column of dictionary-entry cards under a compact control bar; the target word in each example is marked like a highlighter pen. */
:root {
  --bg: #f3f6f5;
  --surface: #ffffff;
  --fg: #16202a;
  --muted: #5b6871;
  --line: #d9e1df;
  --accent: #1d5a88;
  --accent-soft: #e3edf5;
  --marker: #ffe07a;
  --good: #2e7d4f;
  --good-soft: #e3f2e8;
  --f-word: "Literata", "Georgia", "Times New Roman", serif;
  --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-ipa: "Charis SIL", "Doulos SIL", "Gentium Plus", "Lucida Sans Unicode", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151a; --surface: #161f26; --fg: #e5ebee; --muted: #93a1aa; --line: #26323b;
    --accent: #7db6e6; --accent-soft: #1c2c3a; --marker: rgba(255, 210, 80, .30);
    --good: #6fcf97; --good-soft: #17301f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151a; --surface: #161f26; --fg: #e5ebee; --muted: #93a1aa; --line: #26323b;
  --accent: #7db6e6; --accent-soft: #1c2c3a; --marker: rgba(255, 210, 80, .30);
  --good: #6fcf97; --good-soft: #17301f; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

header { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
h1 { font-family: var(--f-word); font-weight: 700; font-size: clamp(28px, 6vw, 38px); line-height: 1.15; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; }

.daynav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.date { font-weight: 700; font-size: 16px; margin-right: auto; font-variant-numeric: tabular-nums; }
.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible + .check-box { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 6px 12px; font-size: 14px; line-height: 1.4;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }

.toolbar {
  display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
}
.group { display: flex; align-items: center; gap: 8px; }
.group-label { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 11px; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 500; }
.play-all { margin-left: auto; background: var(--accent); color: var(--surface); border-color: var(--accent); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.play-all:hover:not(:disabled) { filter: brightness(1.08); }
.toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.notice { font-size: 13px; color: var(--muted); background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; margin: 0; }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;
  transition: border-color .2s, box-shadow .2s;
}
.card.is-active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.card.is-learned .word { color: var(--good); }

.head { display: flex; align-items: flex-start; gap: 12px; }
.head-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.word { font-family: var(--f-word); font-weight: 700; font-size: clamp(26px, 5.5vw, 32px); line-height: 1.2; margin: 0; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.ipa { font-family: var(--f-ipa); font-size: 17px; color: var(--muted); }
.pos { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 6px; }
.meaning { font-size: 16px; font-weight: 500; margin: 0; }

.speak {
  flex: none; width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--surface);
  display: inline-grid; place-items: center; color: var(--accent);
}
.speak:hover { border-color: var(--accent); background: var(--accent-soft); }
.speak.is-speaking { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.speak.sm { width: 34px; height: 34px; }
.speak svg { width: 18px; height: 18px; }

.example { border-top: 1px dashed var(--line); padding-top: 12px; display: flex; gap: 12px; align-items: flex-start; }
.example-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.en { font-family: var(--f-word); font-size: 17px; line-height: 1.55; margin: 0; }
.en mark { background: linear-gradient(transparent 45%, var(--marker) 45%, var(--marker) 92%, transparent 92%); color: inherit; font-weight: 700; padding: 0 1px; }
.ko-line { color: var(--muted); font-size: 14px; margin: 0; }

.hide-ko .ko { filter: blur(6px); cursor: pointer; user-select: none; transition: filter .2s; }
.hide-ko .ko.revealed { filter: none; user-select: auto; }

.foot { display: flex; justify-content: flex-end; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
.check input { position: absolute; opacity: 0; pointer-events: none; }
.check-box { width: 18px; height: 18px; border: 1.5px solid var(--line); border-radius: 5px; display: grid; place-items: center; background: var(--surface); }
.check input:checked + .check-box { background: var(--good); border-color: var(--good); }
.check input:checked + .check-box::after { content: ""; width: 5px; height: 9px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.check input:checked ~ span:last-child { color: var(--good); font-weight: 500; }

.footer-note { font-size: 12px; color: var(--muted); margin: 0; text-align: center; }

@media (max-width: 520px) {
  .card { padding: 16px; }
  .play-all { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">고등 · 수능 · 토플 필수 어휘</span>
    <h1>하루 다섯 단어</h1>
    <p class="sub">매일 자정에 새 단어 5개가 나옵니다. 스피커 버튼을 눌러 발음을 듣고 따라 읽어 보세요.</p>
  </header>

  <div class="daynav">
    <span class="date" id="date"></span>
    <span class="progress" id="progress"></span>
    <button class="btn" id="prev" type="button" aria-label="이전 날">‹ 이전</button>
    <button class="btn" id="today" type="button">오늘</button>
    <button class="btn" id="next" type="button" aria-label="다음 날">다음 ›</button>
  </div>

  <div class="toolbar">
    <div class="group">
      <span class="group-label">발음</span>
      <div class="seg" id="lang">
        <button type="button" id="lang-us" data-v="en-US" aria-pressed="true">미국식</button>
        <button type="button" id="lang-gb" data-v="en-GB" aria-pressed="false">영국식</button>
      </div>
    </div>
    <div class="group">
      <span class="group-label">속도</span>
      <div class="seg" id="rate">
        <button type="button" id="rate-slow" data-v="0.65" aria-pressed="false">느리게</button>
        <button type="button" id="rate-normal" data-v="0.9" aria-pressed="true">보통</button>
        <button type="button" id="rate-fast" data-v="1.1" aria-pressed="false">빠르게</button>
      </div>
    </div>
    <button class="btn toggle" id="hide" type="button" aria-pressed="false">뜻 가리기</button>
    <button class="btn play-all" id="playall" type="button">▶ 전체 듣기</button>
  </div>

  <p class="notice" id="notice" hidden>이 브라우저는 음성 읽기를 지원하지 않습니다. Chrome, Edge, Safari 최신 버전에서 열어 주세요.</p>

  <ol class="list" id="list"></ol>

  <p class="footer-note">단어 150개를 30일 주기로 섞어서 보여 줍니다. 음성은 기기에 설치된 영어 음성을 사용합니다.</p>
</div>

["tangible","adj.","/ˈtændʒəbl/","실체가 있는, 가시적인","The new policy has produced tangible results.","새 정책은 가시적인 성과를 냈다."],
["tolerate","v.","/ˈtɑːləreɪt/","참다, 용인하다","Our school does not tolerate bullying of any kind.","우리 학교는 어떤 형태의 괴롭힘도 용납하지 않는다."],
["unanimous","adj.","/juˈnænɪməs/","만장일치의","The decision to cancel the trip was unanimous.","여행을 취소하자는 결정은 만장일치였다."],
["vivid","adj.","/ˈvɪvɪd/","생생한, 선명한","She gave a vivid description of her trip to Iceland.","그녀는 아이슬란드 여행에 대해 생생하게 묘사했다."],
["zealous","adj.","/ˈzeləs/","열성적인","The zealous fans waited outside the stadium all night.","열성 팬들은 밤새 경기장 밖에서 기다렸다."]
];

const PER = 5, N = W.length, DAYS = Math.floor(N / PER);
const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

// Same date -> same five words on every device; each 30-day cycle is reshuffled.
function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function order(cycle) {
  const r = rng(cycle * 7919 + 2026), a = [...Array(N).keys()];
  for (let i = N - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const dayNumber = d => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
function wordsFor(day) {
  const p = day % DAYS;
  return order(Math.floor(day / DAYS)).slice(p * PER, p * PER + PER).map(i => W[i]);
}

const store = {
  get(k, f) { try { const v = localStorage.getItem(k); return v == null ? f : JSON.parse(v); } catch { return f; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const state = {
  offset: 0,
  lang: store.get("lang", "en-US"),
  rate: store.get("rate", 0.9),
  hide: store.get("hide", false),
  learned: new Set(store.get("learned", []))
};

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function highlight(sentence, word) {
  const stem = word.length > 4 && /[ey]$/.test(word) ? word.slice(0, -1) : word;
  const re = new RegExp("\\b(" + stem + "\\w*)", "i");
  return esc(sentence).replace(re, "<mark>$1</mark>");
}

function viewDay() { return dayNumber(new Date()) + state.offset; }

function render() {
  stopAll();
  const day = viewDay();
  const date = new Date(day * 864e5);
  $("date").textContent = date.toLocaleDateString("ko-KR", { timeZone: "UTC", year: "numeric", month: "long", day: "numeric", weekday: "short" })
    + (state.offset === 0 ? " · 오늘" : "");
  $("next").disabled = state.offset >= 0;
  $("today").disabled = state.offset === 0;

  const words = wordsFor(day);
  $("list").innerHTML = words.map(([w, pos, ipa, ko, ex, exKo], i) => `
    <li class="card${state.learned.has(w) ? " is-learned" : ""}" data-i="${i}">
      <div class="head">
        <div class="head-text">
          <h2 class="word" lang="en">${w}</h2>
          <div class="meta"><span class="ipa">${ipa}</span><span class="pos">${pos}</span></div>
        </div>
        <button class="speak" type="button" data-say="word" data-i="${i}" aria-label="${w} 발음 듣기">${SPEAKER}</button>
      </div>
      <p class="meaning ko">${ko}</p>
      <div class="example">
        <div class="example-text">
          <p class="en" lang="en">${highlight(ex, w)}</p>
          <p class="ko-line ko">${exKo}</p>
        </div>
        <button class="speak sm" type="button" data-say="ex" data-i="${i}" aria-label="예문 듣기">${SPEAKER}</button>
      </div>
      <div class="foot">
        <label class="check">
          <input type="checkbox" id="learned-${w}" data-w="${w}"${state.learned.has(w) ? " checked" : ""}>
          <span class="check-box"></span><span>외웠어요</span>
        </label>
      </div>
    </li>`).join("");
  state.words = words;
  updateProgress();
}

function updateProgress() {
  const n = state.words.filter(([w]) => state.learned.has(w)).length;
  $("progress").textContent = `외운 단어 ${n}/${PER}`;
}

function syncControls() {
  document.querySelectorAll("#lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.lang));
  document.querySelectorAll("#rate button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.v === state.rate));
  $("hide").setAttribute("aria-pressed", state.hide);
  $("hide").textContent = state.hide ? "뜻 보이기" : "뜻 가리기";
  document.body.classList.toggle("hide-ko", state.hide);
}

// ---- Speech ----
const synth = window.speechSynthesis;
let voices = [];
function loadVoices() { voices = synth ? synth.getVoices() : []; }
function pickVoice(lang) {
  const norm = v => v.lang.replace("_", "-").toLowerCase();
  const same = voices.filter(v => norm(v) === lang.toLowerCase());
  const pool = same.length ? same : voices.filter(v => norm(v).startsWith("en"));
  return pool.find(v => /natural|neural|google|online|premium|enhanced/i.test(v.name)) || pool[0] || null;
}

let runId = 0;
function clearMarks() {
  document.querySelectorAll(".is-speaking").forEach(e => e.classList.remove("is-speaking"));
  document.querySelectorAll(".card.is-active").forEach(e => e.classList.remove("is-active"));
}
function say(text, btn, card) {
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = state.lang;
    const v = pickVoice(state.lang);
    if (v) u.voice = v;
    u.rate = state.rate;
    clearMarks();
    btn && btn.classList.add("is-speaking");
    card && card.classList.add("is-active");
    const done = () => { btn && btn.classList.remove("is-speaking"); card && card.classList.remove("is-active"); resolve(); };
    u.onend = done; u.onerror = done;
    synth.speak(u);
  });
}
function stopAll() {
  runId++;
  if (synth) synth.cancel();
  clearMarks();
  $("playall").textContent = "▶ 전체 듣기";
}
const pause = ms => new Promise(r => setTimeout(r, ms));

async function playAll() {
  stopAll();
  const id = runId;
  $("playall").textContent = "■ 멈추기";
  const cards = [...document.querySelectorAll(".card")];
  for (let i = 0; i < state.words.length; i++) {
    const [w, , , , ex] = state.words[i];
    const card = cards[i];
    card.scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    await say(w, card.querySelector('[data-say="word"]'), card); if (id !== runId) return;
    await pause(500); if (id !== runId) return;
    await say(w, card.querySelector('[data-say="word"]'), card); if (id !== runId) return;
    await pause(600); if (id !== runId) return;
    await say(ex, card.querySelector('[data-say="ex"]'), card); if (id !== runId) return;
    await pause(1200); if (id !== runId) return;
  }
  stopAll();
}

// ---- Events ----
$("list").addEventListener("click", e => {
  const ko = e.target.closest(".ko");
  if (ko && state.hide) { ko.classList.toggle("revealed"); return; }
  const btn = e.target.closest("[data-say]");
  if (!btn || !synth) return;
  const wasSpeaking = btn.classList.contains("is-speaking");
  stopAll();
  if (wasSpeaking) return;
  const [w, , , , ex] = state.words[+btn.dataset.i];
  say(btn.dataset.say === "word" ? w : ex, btn, btn.closest(".card"));
});
$("list").addEventListener("change", e => {
  const w = e.target.dataset.w;
  if (!w) return;
  e.target.checked ? state.learned.add(w) : state.learned.delete(w);
  e.target.closest(".card").classList.toggle("is-learned", e.target.checked);
  store.set("learned", [...state.learned]);
  updateProgress();
});
$("lang").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.lang = b.dataset.v; store.set("lang", state.lang); syncControls();
});
$("rate").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.rate = +b.dataset.v; store.set("rate", state.rate); syncControls();
});
$("hide").addEventListener("click", () => {
  state.hide = !state.hide; store.set("hide", state.hide);
  document.querySelectorAll(".ko.revealed").forEach(e => e.classList.remove("revealed"));
  syncControls();
});
$("playall").addEventListener("click", () => {
  if (!synth) return;
  $("playall").textContent.startsWith("■") ? stopAll() : playAll();
});
$("prev").addEventListener("click", () => { state.offset--; render(); });
$("next").addEventListener("click", () => { if (state.offset < 0) { state.offset++; render(); } });
$("today").addEventListener("click", () => { state.offset = 0; render(); });

// Pick up the new day's words if the page stays open past midnight.
let shownToday = dayNumber(new Date());
function checkRollover() {
  const t = dayNumber(new Date());
  if (t !== shownToday) { shownToday = t; if (state.offset === 0) render(); else state.offset--; }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkRollover(); });
setInterval(checkRollover, 60000);

if (synth) {
  loadVoices();
  synth.addEventListener?.("voiceschanged", loadVoices);
} else {
  $("notice").hidden = false;
  $("playall").disabled = true;
}
syncControls();
render();
</script>

</html>
